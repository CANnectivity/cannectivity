name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cannectivity
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: cannectivity
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}

      - name: Build firmware
        working-directory: cannectivity
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T app -v --inline-logs --integration $EXTRA_TWISTER_FLAGS

      - name: Run stack analysis
        id: stackdiff
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            jq \
            wget \
            golang-go \
            build-essential \
            gcc \
            libc6-dev \
            unzip
          wget https://github.com/capstone-engine/capstone/releases/download/6.0.0-Alpha7/libcapstone-dev_6.0.0-Alpha7_amd64.deb
          sudo dpkg -i libcapstone-dev_6.0.0-Alpha7_amd64.deb
          git clone https://github.com/paulwuertz/pexplorer
          cd pexplorer/selfperf

          ls -la /home/runner/work/cannectivity/cannectivity/cannectivity/twister-*/
          ls -la /home/runner/work/cannectivity/cannectivity/cannectivity/twister-*/nucleo_h723zg_stm32h723xx
          ls -la /home/runner/work/cannectivity/cannectivity/cannectivity/twister-*/nucleo_h723zg_stm32h723xx/zephyr_gnu/cannectivity/app/
          ls -la /home/runner/work/cannectivity/cannectivity/cannectivity/twister-*/nucleo_h723zg_stm32h723xx/zephyr_gnu/cannectivity/app/app.cannectivity*

          ARGS="";
          for ELF in `ls /home/runner/work/cannectivity/cannectivity/cannectivity/twister-out/*/zephyr_gnu/cannectivity/app/app.cannectivity.debug/zephyr/zephyr.elf` ; do
            ARGS="$ARGS --elf $ELF";
          done

          echo $ARGS
          echo $ARGS
          echo $ARGS

          STACKSTATS=$(go run ./cmd/stackcheck_boards/stackcheck_boards.go \
            -c /home/runner/work/cannectivity/cannectivity/cannectivity/app/pexplorer-config-usbrxcalls.json \
            $ARGS )

          cd ../..

          {
            echo 'STACKSTATS<<EOF'
            echo "$STACKSTATS"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo $STACKSTATS

      - name: Run firmware tests
        working-directory: cannectivity
        if: startsWith(runner.os, 'Linux')
        shell: bash
        run: |
          # Limit to one concurrent instance as the USBIP port is reused between instances
          west twister -T app -v --inline-logs --platform native_sim/native/64 -j1

      - name: Run tests
        working-directory: cannectivity
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T tests -v --inline-logs --integration $EXTRA_TWISTER_FLAGS

      - name: Print ccache stats
        if: runner.os != 'Windows'
        run: |
          ccache -s -vv
