sample:
  description: CANnectivity USB-to-CAN adapter firmware
  name: cannectivity
common:
  tags:
    - can
    - usb
  harness: console
  harness_config:
    type: one_line
    regex:
      - "CANnectivity firmware initialized with .*"
tests:
  app.cannectivity.debug:
    depends_on:
      - can
      - usbd
    integration_platforms:
      - lpcxpresso55s16
    extra_args:
      - FILE_SUFFIX=debug
  app.cannectivity:
    depends_on:
      - can
      - usbd
    integration_platforms:
      - lpcxpresso55s16
    build_only: true
